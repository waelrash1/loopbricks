name: Test
# On every branch: the app's checks (including the shared-spec cross-check) and the Python package with its notebooks,
# on the oldest Python the package supports (3.10) and the one Colab runs (3.12); keep pyproject.toml's classifiers in step.
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run check
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install "./python[test]"
      - run: python -m ipykernel install --user --name python3
      - run: pytest -q -n 4 python/tests
