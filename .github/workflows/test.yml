name: Test
# On every branch: the app's checks (including the shared-spec cross-check) and the Python package with its notebooks,
# on the oldest Python the package supports (3.10) and the one Colab runs (3.12); keep pyproject.toml's classifiers in step.
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run check
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install "./python[test]"
      - run: python -m ipykernel install --user --name python3
      # on failure, name each failing test and its error as an annotation, readable without signing in
      - run: |
          set -o pipefail
          pytest -q -n 4 -rf --tb=line python/tests 2>&1 | tee pytest.log
      - if: failure()
        run: |
          sed 's/\x1b\[[0-9;]*m//g' pytest.log | grep -E "^(FAILED|E +[A-Za-z]*(Error|Exception|Reply))" | head -20 | sed 's/^/::error::/'
