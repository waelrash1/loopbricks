name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  # republish when the AI edition changes: after the Test workflow passes on book-ai (this file, from main, runs)
  workflow_run:
    workflows: [Test]
    branches: [book-ai]
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main # a workflow_run event would otherwise check out the default branch anyway; say so
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # the stable 1.0 release stays online at /v1/, built from its tag (the app uses relative paths, so a sub-folder works)
      - uses: actions/checkout@v7
        with:
          ref: v1.0
          path: v1-src
      - run: cd v1-src && npm ci && npm run build && cp -r dist ../dist/v1
      # the book at /book/: Quarto runs every notebook against this commit's package, so plots are always current
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "./python[test]" jupyter && python -m ipykernel install --user --name python3
      - uses: quarto-dev/quarto-actions/setup@v2
      - run: quarto render notebooks && cp -r notebooks/_book dist/book
        env:
          MPLBACKEND: Agg
      # the AI edition of the book at /book-ai/, rendered from its own branch with that branch's package
      # (installed after the main book is done, so /book/ keeps this commit's package)
      - uses: actions/checkout@v7
        with:
          ref: book-ai
          path: book-ai-src
      - run: pip install "./book-ai-src/python[test]" && quarto render book-ai-src/notebooks && cp -r book-ai-src/notebooks/_book dist/book-ai
        env:
          MPLBACKEND: Agg
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  # separate job, as in GitHub's own template: the artifact is only reliably visible once the build job has finished
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
