[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "loopbricks"
dynamic = ["version"]
description = "System dynamics molecules you can run, combine and study: the Python companion to the LoopBricks app"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Wael Rashwan", email = "wael.rashwan@mu.ie" }]
keywords = ["system dynamics", "simulation", "stock and flow", "feedback", "modelling", "education", "molecules of structure"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Education",
]
dependencies = ["numpy>=1.22", "pandas>=1.4"]

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
test = ["pytest>=7", "pytest-xdist>=3", "matplotlib>=3.5", "nbclient>=0.7", "nbformat>=5", "ipykernel>=6", "pysd>=3.14"]  # pysd: Appendix E runs Vensim and Stella files

[project.urls]
Homepage = "https://waelrash1.github.io/loopbricks/"
Source = "https://github.com/waelrash1/loopbricks"
Issues = "https://github.com/waelrash1/loopbricks/issues"

[tool.hatch.version]
path = "loopbricks/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["loopbricks"]
