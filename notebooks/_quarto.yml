# The book. Chapters are the cNN notebooks; the NN module notebooks (also opened from the app and Colab) are appendices.
# Build with `npm run book`, which renders and then clears the outputs that rendering saves into the notebooks
# (or `quarto preview notebooks` while writing).
project:
  type: book
  output-dir: _book

book:
  title: "System Dynamics with Python"
  subtitle: "Building, testing and using feedback models for decisions"
  author: "Wael Rashwan"
  repo-url: https://github.com/waelrash1/loopbricks
  repo-subdir: notebooks
  repo-branch: main
  repo-actions: [source, issue]
  chapters:
    - index.qmd
    - part: "Getting started"
      chapters:
        - c01-push-back.ipynb
        - c02-story-to-diagram.ipynb
    - part: "How structure drives behaviour"
      chapters:
        - c03-loops.ipynb
        - c04-delays.ipynb
        - c05-decisions.ipynb
        - c06-swings.ipynb
        - c07-patterns.ipynb
    - part: "Evidence"
      chapters:
        - c08-learning.ipynb
        - c09-testing.ipynb
        - c10-calibration.ipynb
    - part: "Models in use"
      chapters:
        - c11-model-to-decision.ipynb
        - c12-models-that-learn.ipynb
  # ponytail: the 18 app-module notebooks follow the written appendices until A to F are all in place
  appendices:
    - a01-python.ipynb
    - 01-surprise.ipynb
    - 02-stocks-flows.ipynb
    - 03-loops.ipynb
    - 04-patterns.ipynb
    - 05-first-order.ipynb
    - 06-delays.ipynb
    - 07-s-shaped.ipynb
    - 08-lock-in.ipynb
    - 09-chains.ipynb
    - 10-oscillation.ipynb
    - 11-archetypes.ipynb
    - 12-process.ipynb
    - 13-formulation.ipynb
    - 14-behaviour.ipynb
    - 15-cycles.ipynb
    - 16-testing.ipynb
    - 17-mechanics.ipynb
    - 18-frontier.ipynb

bibliography: references.bib

execute:
  enabled: true # run every notebook while rendering, so the book shows fresh plots
  freeze: auto  # ponytail: re-run only notebooks that changed; commit _freeze/ if CI should skip execution

format:
  html:
    theme: cosmo
    toc: true
    number-depth: 1 # the notebooks number their own sections
    css: book.css
    code-overflow: wrap
