# The LoopBricks book. Each chapter is one of the notebooks in this folder, so the book, Colab and the app's
# "Open in Colab" links all use the same files. Build with `npm run book`, which renders and then clears the outputs
# that rendering saves into the notebooks (or `quarto preview notebooks` while writing).
project:
  type: book
  output-dir: _book

book:
  title: "System Dynamics with LoopBricks"
  subtitle: "Feedback, stocks and flows, in the browser and in Python"
  author: "Wael Rashwan"
  repo-url: https://github.com/waelrash1/loopbricks
  repo-subdir: notebooks
  repo-branch: main
  repo-actions: [source, issue]
  chapters:
    - index.qmd
    - part: "Foundations"
      chapters:
        - 01-surprise.ipynb
        - 02-stocks-flows.ipynb
        - 03-loops.ipynb
        - 04-patterns.ipynb
    - part: "Core dynamics"
      chapters:
        - 05-first-order.ipynb
        - 06-delays.ipynb
        - 07-s-shaped.ipynb
        - 08-lock-in.ipynb
        - 09-chains.ipynb
        - 10-oscillation.ipynb
        - 11-archetypes.ipynb
    - part: "Modelling practice"
      chapters:
        - 12-process.ipynb
        - 13-formulation.ipynb
        - 14-behaviour.ipynb
        - 15-cycles.ipynb
        - 16-testing.ipynb
    - part: "Advanced"
      chapters:
        - 17-mechanics.ipynb
        - 18-frontier.ipynb

execute:
  enabled: true # run every notebook while rendering, so the book shows fresh plots
  freeze: auto  # ponytail: re-run only notebooks that changed; commit _freeze/ if CI should skip execution

format:
  html:
    theme: cosmo
    toc: true
    number-depth: 1 # the notebooks number their own sections
    css: book.css
    code-overflow: wrap
