# The book. Chapters are the cNN notebooks and appendices the aNN ones. The NN module notebooks are not in the book;
# the app opens them in Colab from their files.
# Build with `npm run book`, which renders and then clears the outputs that rendering saves into the notebooks
# (or `quarto preview notebooks` while writing).
project:
  type: book
  output-dir: _book
  render: [index.qmd, "c*.ipynb", "a*.ipynb"] # the NN module notebooks stay out of the book

book:
  title: "System Dynamics with Python"
  subtitle: "Building, testing and using feedback models for decisions"
  author: "Wael Rashwan"
  repo-url: https://github.com/waelrash1/loopbricks
  repo-subdir: notebooks
  repo-branch: main
  repo-actions: [source, issue]
  chapters:
    - index.qmd
    - part: "Getting started"
      chapters:
        - c01-push-back.ipynb
        - c02-story-to-diagram.ipynb
    - part: "How structure drives behaviour"
      chapters:
        - c03-loops.ipynb
        - c04-delays.ipynb
        - c05-decisions.ipynb
        - c06-swings.ipynb
        - c07-patterns.ipynb
    - part: "Evidence"
      chapters:
        - c08-learning.ipynb
        - c09-testing.ipynb
        - c10-calibration.ipynb
    - part: "Models in use"
      chapters:
        - c11-model-to-decision.ipynb
        - c12-models-that-learn.ipynb
    - part: "Applications"
      chapters:
        - c13-supply-chain.ipynb
        - c14-epidemic.ipynb
        - c15-project.ipynb
        - c16-fishery.ipynb
  appendices:
    - a01-python.ipynb
    - a02-package.ipynb
    - a03-molecules.ipynb
    - a04-glossary.ipynb
    - a05-vensim-stella.ipynb
    - a06-toolkit.ipynb

bibliography: references.bib

execute:
  enabled: true # run every notebook while rendering, so the book shows fresh plots
  freeze: auto  # ponytail: re-run only notebooks that changed; commit _freeze/ if CI should skip execution

format:
  html:
    theme: cosmo
    toc: true
    number-depth: 1 # the notebooks number their own sections
    css: book.css
    code-overflow: wrap
